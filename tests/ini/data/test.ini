# Comments.
# --------
# A comment line.
    # An indented comment line.
# A comment line containing an = sign and a # symbol.
#


# Key/value separator and whitespace.
# ----------------------------------
compact=1
spaced = 2
	tabbed	=	3
  indented = 4


# String keys and values.
# ----------------------
string_key = string_value
value_with_spaces = the quick brown fox
quoted_value = "quoted string"
value_with_equals = a=b
empty_value =


# Numeric keys and values.
# -----------------------
0 = zero
1234 = 5678
integer_value = 42
negative_value = -7
float_value = 3.14
exponent_value = 1.5e-3
hex_value = 0x1F


# Inline comments.
# ---------------
comment_spaced = 10 # comment following the value
comment_preceded_nospace = 11# comment without preceding space
comment_with_equals = 12 # vr=268440798 # 1= R+L by Modulation
comment_marker_only = 13 #
comment_on_val = #14 # value with # followed by comment
comment_follow_nospace = 15 #comment without following space


# Duplicate keys, the last occurrence is used.
# -------------------------------------------
duplicate_key = first
duplicate_key = second
duplicate_key = third


# Keys are case sensitive.
# -----------------------
case_key = lower
CASE_KEY = upper


# Section markers are ignored, keys remain global.
# -----------------------------------------------
[section]
section_key = section_value


# Keys with special characters.
# ----------------------------
key.with.dots = dotted
key-with-dashes = dashed
key with spaces = spaced key
array_key[1] = 1
array_key[32] = 32


# Environment variables, expanded by ini_expand_vars().
# ----------------------------------------------------
env_value = ${INI_TEST_VAR:-default_value}


# Generated parameters.
# --------------------
# A generated-style key with metadata and multiple inline comments.
configuration_value = 1 # metadata=268440798 # mode=modulated
#
# Duplicate generated-style key; the last value wins.
idle_value = 1.2    # metadata=268440813   # Original value
idle_value = 0.4    # metadata=268440813
#
caliper_type = 2 # metadata=268440821      ; 1=stiffness, 2=volume-pressure
front_volume[31] = 6.86 # metadata=268441119
front_volume[32] = 6.87 # metadata=268441120
